<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta
      name="keywords"
      content="khmer developers, developer community, software jobs, tech events, portfolios, community feed, cambodia developers"
    />
    <meta name="theme-color" content="#5865f2" />
    <meta property="og:site_name" content="khmerdevcommunity" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<%= productName %>" />
    <meta property="og:description" content="<%= productDescription %>" />
    <meta property="og:url" content="https://khmerdevcommunity.vercel.app/" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="<%= productName %>" />
    <meta property="twitter:description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" href="/img/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/img/logo.png" />
    <link rel="apple-touch-icon" href="/img/logo.png" />
    <link rel="canonical" href="https://khmerdevcommunity.vercel.app/" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
